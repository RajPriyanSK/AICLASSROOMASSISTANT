kind = "web"
previewPath = "/"
title = "AI Classroom Assistant"
version = "1.0.0"
id = "artifacts/classroom"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 21986
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/classroom run dev"

[services.env]
PORT = "21986"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/classroom", "run", "build"]
publicDir = "artifacts/classroom/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
