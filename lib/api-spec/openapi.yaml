openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: AI Classroom Assistant API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: users
    description: User management
  - name: lectures
    description: Lecture management
  - name: transcripts
    description: Transcript management
  - name: tasks
    description: Task management
  - name: questions
    description: Student Q&A
  - name: chat
    description: AI Chatbot

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /users/sync:
    post:
      operationId: syncUser
      tags: [users]
      summary: Sync Firebase user to database
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncUserBody"
      responses:
        "200":
          description: User synced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/me:
    get:
      operationId: getMe
      tags: [users]
      summary: Get current user profile
      parameters:
        - in: query
          name: firebaseUid
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Not found

  /lectures:
    get:
      operationId: getLectures
      tags: [lectures]
      summary: List lectures
      parameters:
        - in: query
          name: firebaseUid
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of lectures
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lecture"
    post:
      operationId: createLecture
      tags: [lectures]
      summary: Create a lecture
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLectureBody"
      responses:
        "201":
          description: Lecture created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lecture"

  /lectures/{id}:
    get:
      operationId: getLecture
      tags: [lectures]
      summary: Get a lecture
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Lecture detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LectureDetail"
        "404":
          description: Not found
    delete:
      operationId: deleteLecture
      tags: [lectures]
      summary: Delete a lecture
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /lectures/{id}/process:
    post:
      operationId: processLecture
      tags: [lectures]
      summary: Process audio - transcribe, summarize and extract tasks
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcessLectureBody"
      responses:
        "200":
          description: Processing started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessLectureResponse"

  /lectures/{id}/upload-url:
    post:
      operationId: getUploadUrl
      tags: [lectures]
      summary: Get a signed upload URL for Supabase Storage
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GetUploadUrlBody"
      responses:
        "200":
          description: Upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"

  /tasks:
    get:
      operationId: getTasks
      tags: [tasks]
      summary: List tasks (optionally filter by lecture)
      parameters:
        - in: query
          name: lectureId
          required: false
          schema:
            type: ["integer", "null"]
        - in: query
          name: firebaseUid
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"

  /tasks/{id}/approve:
    patch:
      operationId: approveTask
      tags: [tasks]
      summary: Teacher approves a task
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Task approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /tasks/{id}/reject:
    patch:
      operationId: rejectTask
      tags: [tasks]
      summary: Teacher rejects a task
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Task rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /tasks/{id}/complete:
    patch:
      operationId: completeTask
      tags: [tasks]
      summary: Student marks a task as complete
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Task completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /transcribe:
    post:
      operationId: transcribeLecture
      tags: [transcripts]
      summary: Send audio URL to RapidAPI Speech-to-Text and store transcript in PostgreSQL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TranscribeBody"
      responses:
        "200":
          description: Transcription successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscribeResponse"
        "400":
          description: audioUrl is missing
        "404":
          description: Lecture not found
        "500":
          description: Transcription failed

  /upload-lecture-audio:
    post:
      operationId: uploadLectureAudio
      tags: [lectures]
      summary: Upload audio file directly to Supabase Storage
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                audio:
                  type: string
                  format: binary
                  description: The audio file to upload
                lectureId:
                  type: string
                  description: Optional lecture ID used for naming the file
              required: [audio]
      responses:
        "201":
          description: Audio uploaded successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AudioUploadResponse"
        "400":
          description: No audio file provided
        "500":
          description: Upload failed

  /questions:
    get:
      operationId: getQuestions
      tags: [questions]
      summary: List questions (for a lecture or all)
      parameters:
        - in: query
          name: firebaseUid
          required: true
          schema:
            type: string
        - in: query
          name: lectureId
          required: false
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: List of questions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Question"
    post:
      operationId: createQuestion
      tags: [questions]
      summary: Student submits a question
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateQuestionBody"
      responses:
        "201":
          description: Question created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Question"

  /questions/{id}/answer:
    patch:
      operationId: answerQuestion
      tags: [questions]
      summary: Teacher answers a question
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswerQuestionBody"
      responses:
        "200":
          description: Question answered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Question"

  /questions/{id}:
    delete:
      operationId: deleteQuestion
      tags: [questions]
      summary: Delete a question
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /chat:
    post:
      operationId: chat
      tags: [chat]
      summary: Chat with AI about a lecture
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatBody"
      responses:
        "200":
          description: Chat response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    User:
      type: object
      properties:
        id:
          type: integer
        firebaseUid:
          type: string
        email:
          type: string
        displayName:
          type: ["string", "null"]
        role:
          type: string
          enum: [teacher, student]
        createdAt:
          type: string
          format: date-time
      required: [id, firebaseUid, email, role, createdAt]

    SyncUserBody:
      type: object
      properties:
        firebaseUid:
          type: string
        email:
          type: string
        displayName:
          type: ["string", "null"]
        role:
          type: string
          enum: [teacher, student]
      required: [firebaseUid, email, role]

    Lecture:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: ["string", "null"]
        audioUrl:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, processing, done, error]
        teacherUid:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, title, status, teacherUid, createdAt, updatedAt]

    LectureDetail:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: ["string", "null"]
        audioUrl:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, processing, done, error]
        teacherUid:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        transcript:
          type: ["string", "null"]
        summary:
          type: ["string", "null"]
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/Task"
      required: [id, title, status, teacherUid, createdAt, updatedAt]

    CreateLectureBody:
      type: object
      properties:
        title:
          type: string
        description:
          type: ["string", "null"]
        teacherUid:
          type: string
      required: [title, teacherUid]

    ProcessLectureBody:
      type: object
      properties:
        audioUrl:
          type: string
      required: [audioUrl]

    ProcessLectureResponse:
      type: object
      properties:
        lectureId:
          type: integer
        status:
          type: string
        transcript:
          type: ["string", "null"]
        summary:
          type: ["string", "null"]
        tasksExtracted:
          type: integer
      required: [lectureId, status, tasksExtracted]

    GetUploadUrlBody:
      type: object
      properties:
        fileName:
          type: string
        contentType:
          type: string
      required: [fileName, contentType]

    UploadUrlResponse:
      type: object
      properties:
        uploadUrl:
          type: string
        publicUrl:
          type: string
      required: [uploadUrl, publicUrl]

    Task:
      type: object
      properties:
        id:
          type: integer
        lectureId:
          type: integer
        title:
          type: string
        description:
          type: ["string", "null"]
        deadline:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, approved, rejected, completed]
        createdAt:
          type: string
          format: date-time
      required: [id, lectureId, title, status, createdAt]

    TranscribeBody:
      type: object
      properties:
        audioUrl:
          type: string
          description: Publicly accessible URL of the audio file
        lectureId:
          type: ["integer", "null"]
          description: Optional lecture ID — if provided, stores transcript in Neon PostgreSQL
        language:
          type: string
          default: en
          description: BCP-47 language code (e.g. "en", "es", "fr")
      required: [audioUrl]

    TranscribeResponse:
      type: object
      properties:
        transcript:
          type: string
          description: Full transcript text returned by RapidAPI
        lectureId:
          type: ["integer", "null"]
        audioUrl:
          type: string
        language:
          type: string
        charCount:
          type: integer
          description: Number of characters in the transcript
        wordCount:
          type: integer
          description: Number of words in the transcript
      required: [transcript, audioUrl, language, charCount, wordCount]

    AudioUploadResponse:
      type: object
      properties:
        publicUrl:
          type: string
          description: Public URL of the uploaded audio file
        fileName:
          type: string
          description: Name of the file in Supabase Storage
        size:
          type: integer
          description: File size in bytes
        mimeType:
          type: string
          description: MIME type of the uploaded file
      required: [publicUrl, fileName, size, mimeType]

    Question:
      type: object
      properties:
        id:
          type: integer
        studentId:
          type: integer
        lectureId:
          type: integer
        question:
          type: string
        answer:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required: [id, studentId, lectureId, question, createdAt]

    CreateQuestionBody:
      type: object
      properties:
        firebaseUid:
          type: string
        lectureId:
          type: integer
        question:
          type: string
      required: [firebaseUid, lectureId, question]

    AnswerQuestionBody:
      type: object
      properties:
        answer:
          type: string
      required: [answer]

    ChatBody:
      type: object
      properties:
        lectureId:
          type: integer
        message:
          type: string
        firebaseUid:
          type: string
      required: [lectureId, message, firebaseUid]

    ChatResponse:
      type: object
      properties:
        answer:
          type: string
      required: [answer]
